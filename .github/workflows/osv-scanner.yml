# OSV Scanner — 依赖漏洞扫描
name: OSV Scanner

on:
  push:
    branches: [develop, main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 osv-scanner
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: 运行漏洞扫描
        run: |
          set -euo pipefail
          osv-scanner scan --lockfile=pubspec.lock --format=sarif --output=osv-results.sarif . || true

      - name: 上传 SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: osv-results.sarif
