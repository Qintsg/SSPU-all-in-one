# Release 工作流
# 公开 Release 只在带 release 标签的 PR merge 后触发，版本、Tag 与资产命名统一来自 pubspec.yaml。
name: Build & Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      base_ref:
        description: '本次手动发布对应的目标分支（alpha / beta / rc 填 develop；stable / lts / hotfix 填 main）'
        required: true
        default: 'develop'
      release_notes:
        description: '手动触发时使用的 Release Notes，必须包含标准 7 个章节'
        required: true

env:
  FLUTTER_VERSION: '3.44.0'
  FLUTTER_GIT_URL: 'https://github.com/flutter/flutter.git'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.base_ref || github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'release')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      public_version: ${{ steps.release.outputs.public_version }}
      pubspec_version: ${{ steps.release.outputs.pubspec_version }}
      version_core: ${{ steps.release.outputs.version_core }}
      channel: ${{ steps.release.outputs.channel }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_title: ${{ steps.release.outputs.release_title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: release
        uses: ./.github/actions/release-context

      - name: 校验触发分支
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BASE_REF: ${{ github.event.inputs.base_ref }}
          CURRENT_REF: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            base_ref="$MANUAL_BASE_REF"
            current_ref="$CURRENT_REF"
            if [[ "$current_ref" != "$base_ref" ]]; then
              echo "手动发布的当前 ref 必须与 base_ref 一致：current_ref=$current_ref, base_ref=$base_ref。" >&2
              exit 1
            fi
          else
            base_ref="$PR_BASE_REF"
          fi

          channel="$RELEASE_CHANNEL"

          if [[ "$channel" == "stable" || "$channel" == "lts" || "$channel" == "hotfix" ]]; then
            [[ "$base_ref" == "main" ]] || {
              echo "stable / lts / hotfix Release 必须由 develop -> main 的 release PR merge 触发。" >&2
              exit 1
            }
            exit 0
          fi

          [[ "$base_ref" == "develop" ]] || {
            echo "alpha / beta / rc Release 必须由 release/v... -> develop 的 release PR merge 触发，当前目标分支为 $base_ref。" >&2
            exit 1
          }

      - name: 校验 Release Tag 不存在
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null; then
            echo "Release Tag ${{ steps.release.outputs.tag }} 已存在。重发同一公开版本时必须递增 pubspec.yaml 的 +build 并重新走发版流程。" >&2
            exit 1
          fi

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 准备 Android Release 签名
        shell: bash
        run: |
          set -euo pipefail

          missing_secrets=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            printf 'Android Release 签名 Secrets 缺失：%s\n' "${missing_secrets[*]}" >&2
            echo "正式发布不得回退到 debug 签名策略。" >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ci-release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' 'app/ci-release.jks'
          } > android/key.properties

      - name: 构建 Android APK（按 ABI 拆分）
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: 整理 Android 产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-x86_64.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-assets
          path: |
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-armeabi-v7a.apk
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-arm64-v8a.apk
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-android-x86_64.apk

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 构建 Windows x64
        run: flutter build windows --release

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 生成 Windows 安装器
        shell: pwsh
        run: |
          $installerCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $installerCompiler)) {
            throw "未找到 Inno Setup 编译器：$installerCompiler"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $installerCompiler '.github\installer\windows-x64.iss'

      - uses: ./.github/actions/package-windows-portable
        with:
          bundle-dir: build\windows\x64\runner\Release
          output-path: dist\SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-x64-portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-assets
          path: |
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-x64-portable.zip

  build-windows-arm64:
    needs: prepare
    runs-on: windows-11-arm
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: arm64

      - uses: ./.github/actions/setup-flutter-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-git-url: ${{ env.FLUTTER_GIT_URL }}
          desktop-target: windows

      - name: 构建 Windows arm64
        run: flutter build windows --release

      - name: 定位 Windows arm64 构建目录
        id: windows-arm64-bundle
        shell: pwsh
        run: |
          $windowsExecutables = Get-ChildItem -Path 'build\windows' -Filter 'sspu_allinone.exe' -Recurse
          if ($windowsExecutables.Count -eq 0) {
            Get-ChildItem -Path 'build\windows' -Recurse | Select-Object FullName
            throw '未找到 Windows arm64 构建产物中的主程序。'
          }

          $bundlePath = $windowsExecutables[0].Directory.FullName
          "WINDOWS_ARM64_BUNDLE_DIR=$bundlePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "bundle-dir=$bundlePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows arm64 bundle path: $bundlePath"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 生成 Windows arm64 安装器
        shell: pwsh
        run: |
          $installerCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'

          if (-not (Test-Path $installerCompiler)) {
            throw "未找到 Inno Setup 编译器：$installerCompiler"
          }

          if (-not (Test-Path $env:WINDOWS_ARM64_BUNDLE_DIR)) {
            throw "未找到 Windows arm64 构建目录：$env:WINDOWS_ARM64_BUNDLE_DIR"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $installerCompiler '.github\installer\windows-arm64.iss'

      - uses: ./.github/actions/package-windows-portable
        with:
          bundle-dir: ${{ steps.windows-arm64-bundle.outputs.bundle-dir }}
          output-path: dist\SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-arm64-portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-assets
          path: |
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-arm64-setup.exe
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-windows-arm64-portable.zip

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 构建 macOS universal
        run: flutter build macos --release

      - name: 自签名 macOS App Bundle
        shell: bash
        run: |
          set -euo pipefail

          macos_app_bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$macos_app_bundle" ]] || {
            echo "未找到 macOS .app 产物。" >&2
            exit 1
          }

          echo "使用 ad-hoc 自签名（未配置官方 Developer ID 签名与公证）"
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements \
            "$macos_app_bundle"

      - name: 生成 macOS DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          macos_app_bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"

          npm ci --prefix .github/npm/appdmg

          staging="dmg-staging"
          mkdir -p "$staging"
          cp -R "$macos_app_bundle" "$staging/"
          cp .github/installer/macos/bg.png "$staging/bg.png"

          APP_VERSION="${{ needs.prepare.outputs.public_version }}"
          DMG_TITLE="SSPU-AIO v${APP_VERSION}"
          if [ "${#DMG_TITLE}" -gt 27 ]; then
            echo "::warning::macOS DMG volume title '${DMG_TITLE}' is longer than appdmg limit; using short product title"
            DMG_TITLE="SSPU-AIO"
          fi

          cat > "$staging/config.json" << APPDMG_EOF
          {
            "title": "${DMG_TITLE}",
            "icon-size": 80,
            "window": {
              "size": {
                "width": 520,
                "height": 360
              }
            },
            "background": "bg.png",
            "contents": [
              { "x": 130, "y": 215, "type": "file", "path": "SSPU-AllinOne.app" },
              { "x": 395, "y": 215, "type": "link", "path": "/Applications" }
            ]
          }
          APPDMG_EOF

          ./.github/npm/appdmg/node_modules/.bin/appdmg "$staging/config.json" \
            "dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-macos-arm64.dmg"

          rm -rf "$staging"
          echo "dmg_suffix=arm64" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-macos-${{ steps.dmg.outputs.dmg_suffix }}.dmg

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux 打包依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libnotify-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            desktop-file-utils \
            fakeroot \
            file \
            patchelf \
            rpm \
            ruby \
            ruby-dev \
            wget
          sudo gem install --no-document fpm

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 构建 Linux x64
        run: flutter build linux --release --target-platform linux-x64

      - uses: ./.github/actions/package-linux-release-assets
        with:
          version: ${{ needs.prepare.outputs.version }}
          channel: ${{ needs.prepare.outputs.channel }}
          build-number: ${{ needs.prepare.outputs.build_number }}
          bundle-dir: build/linux/x64/release/bundle
          arch-label: x64
          deb-architecture: amd64
          rpm-architecture: x86_64
          appimagetool-architecture: x86_64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-assets
          path: |
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-x64.AppImage
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-x64.deb
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-x64.rpm
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-x64-portable.tar.gz

  build-linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Linux arm64 打包依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libnotify-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            desktop-file-utils \
            fakeroot \
            file \
            patchelf \
            rpm \
            ruby \
            ruby-dev \
            wget
          sudo gem install --no-document fpm

      - uses: ./.github/actions/setup-flutter-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          flutter-git-url: ${{ env.FLUTTER_GIT_URL }}
          desktop-target: linux

      - name: 构建 Linux arm64
        run: flutter build linux --release --target-platform linux-arm64

      - uses: ./.github/actions/package-linux-release-assets
        with:
          version: ${{ needs.prepare.outputs.version }}
          channel: ${{ needs.prepare.outputs.channel }}
          build-number: ${{ needs.prepare.outputs.build_number }}
          bundle-dir: build/linux/arm64/release/bundle
          arch-label: arm64
          deb-architecture: arm64
          rpm-architecture: aarch64
          appimagetool-architecture: aarch64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-assets
          path: |
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-arm64.AppImage
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-arm64.deb
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-arm64.rpm
            dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-linux-arm64-portable.tar.gz

  build-ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 整理 iOS 产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/ios/iphoneos
          zip -r "$OLDPWD/dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-ios-arm64.app.zip" Runner.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app
          path: dist/SSPU-AllinOne-v${{ needs.prepare.outputs.version }}-ios-arm64.app.zip

  publish:
    if: needs.prepare.result == 'success'
    needs:
      [
        prepare,
        build-android,
        build-windows,
        build-windows-arm64,
        build-macos,
        build-linux,
        build-linux-arm64,
        build-ios,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          run-pub-get: 'false'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: 生成 Release Notes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MANUAL_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s' "$MANUAL_RELEASE_NOTES" > pr-body.md
          else
            printf '%s' "$PR_BODY" > pr-body.md
          fi

          python scripts/release/render_release_notes.py \
            --body-file pr-body.md \
            --output dist/release-notes.md

      - name: 收集工具链版本
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter_version="$(flutter --version --machine | python -c "import json,sys; print(json.load(sys.stdin)['frameworkVersion'])")"
          dart_version="$(dart --version 2>&1 | awk '{print $4}')"
          release_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          {
            echo "flutter_version=$flutter_version"
            echo "dart_version=$dart_version"
            echo "release_date=$release_date"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/generate-release-metadata
        with:
          asset-dir: dist
          version: ${{ needs.prepare.outputs.version }}
          pubspec-version: ${{ needs.prepare.outputs.pubspec_version }}
          channel: ${{ needs.prepare.outputs.channel }}
          build-number: ${{ needs.prepare.outputs.build_number }}
          tag: ${{ needs.prepare.outputs.tag }}
          release-date: ${{ steps.toolchain.outputs.release_date }}
          flutter-version: ${{ steps.toolchain.outputs.flutter_version }}
          dart-version: ${{ steps.toolchain.outputs.dart_version }}

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.release_title }}
          body_path: dist/release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: dist/*
